name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "*.config.*"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-frontend.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-frontend-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: relicavaiden-portfolio-frontend
  TASK_FAMILY: default-relicavaiden-portfolio-frontend
  NEXT_PUBLIC_API_BASE_URL: https://api.relicavaiden.com

jobs:
  validate:
    name: Test frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  deploy:
    name: Deploy frontend
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "496199073264"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push frontend
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha,scope=portfolio-frontend
          cache-to: type=gha,mode=max,scope=portfolio-frontend

      - name: Register frontend task definition
        id: task
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition \
            --output json > current.json

          jq -e \
            '.containerDefinitions[] | select(.name == "Main")' \
            current.json > /dev/null

          jq \
            --arg IMAGE "$IMAGE" \
            '
            .containerDefinitions |= map(
              if .name == "Main"
              then .image = $IMAGE
              else .
              end
            )
            |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            ' \
            current.json > new.json

          TASK_DEFINITION_ARN=$(
            aws ecs register-task-definition \
              --cli-input-json file://new.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )

          echo "task_definition_arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        run: |
          aws ecs update-express-gateway-service \
            --service-arn "${{ vars.ECS_FRONTEND_SERVICE_ARN }}" \
            --task-definition-arn "${{ steps.task.outputs.task_definition_arn }}" \
            > /dev/null

      - name: Wait for frontend
        env:
          SERVICE_ARN: ${{ vars.ECS_FRONTEND_SERVICE_ARN }}
          EXPECTED_TASK_DEFINITION: ${{ steps.task.outputs.task_definition_arn }}
        run: |
          for attempt in $(seq 1 60); do
            ACTIVE=$(
              aws ecs describe-express-gateway-service \
                --service-arn "$SERVICE_ARN" \
                --query 'service.activeConfigurations[].taskDefinitionArn' \
                --output text
            )

            if [ "$ACTIVE" = "$EXPECTED_TASK_DEFINITION" ]; then
              echo "Frontend deployment is active."
              exit 0
            fi

            echo "Waiting for frontend deployment..."
            sleep 10
          done

          echo "Frontend deployment did not stabilize."
          exit 1

      - name: Verify frontend
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --output /dev/null \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            https://relicavaiden.com
